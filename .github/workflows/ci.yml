name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore solution
        run: dotnet restore StorageMaster.sln

      - name: Rust format check
        working-directory: turbo-scanner
        run: cargo fmt --check

      - name: Rust lint
        working-directory: turbo-scanner
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: turbo-scanner
        run: cargo test

      - name: Rust release build
        working-directory: turbo-scanner
        run: cargo build --release

      - name: Verify formatting
        run: dotnet format StorageMaster.sln --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build StorageMaster.sln -c Release --no-restore

      - name: Test solution
        env:
          STORAGEMASTER_REQUIRE_TURBO_SCANNER: 'true'
          STORAGEMASTER_TURBO_SCANNER_BINARY: ${{ github.workspace }}\turbo-scanner\target\release\turbo-scanner.exe
        run: dotnet test StorageMaster.sln -c Release --no-build
