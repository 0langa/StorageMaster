name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore solution
        run: dotnet restore StorageMaster.sln

      - name: Rust format check
        working-directory: turbo-scanner
        run: cargo fmt --check

      - name: Rust lint
        working-directory: turbo-scanner
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: turbo-scanner
        run: cargo test

      - name: Rust release build
        working-directory: turbo-scanner
        run: cargo build --release

      - name: Lint installer script
        shell: pwsh
        run: |
          # ISPP treats any line whose first non-blank character is '#' as a
          # preprocessor directive, including inside [Code]. A Pascal string
          # such as #13#10 at the start of a line aborts the compile, and that
          # only surfaces on a release tag. Catch it here instead.
          $lines = Get-Content -LiteralPath 'installer\StorageMaster.iss'
          $inCode = $false
          $bad = @()
          for ($i = 0; $i -lt $lines.Count; $i++) {
              $line = $lines[$i]
              if ($line -match '^\s*\[([^\]]+)\]\s*$') {
                  $inCode = $Matches[1] -ieq 'Code'
                  continue
              }
              if ($inCode -and $line -match '^\s*#') {
                  $bad += "line $($i + 1): $line"
              }
          }
          if ($bad.Count -gt 0) {
              Write-Error ("Lines in [Code] start with '#' and will be parsed as preprocessor directives:`n" + ($bad -join "`n"))
              exit 1
          }
          Write-Host 'Installer script lint passed.'

      - name: Verify formatting
        run: dotnet format StorageMaster.sln --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build StorageMaster.sln -c Release --no-restore

      - name: Test solution
        env:
          STORAGEMASTER_REQUIRE_TURBO_SCANNER: 'true'
          STORAGEMASTER_TURBO_SCANNER_BINARY: ${{ github.workspace }}\turbo-scanner\target\release\turbo-scanner.exe
        run: dotnet test StorageMaster.sln -c Release --no-build
