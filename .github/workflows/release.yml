name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turbo-scanner/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('turbo-scanner/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Turbo Scanner (Rust)
        run: cargo build --release --manifest-path turbo-scanner/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Determine signing mode
        id: signing
        shell: pwsh
        env:
          PFX_B64:  ${{ secrets.CODE_SIGNING_PFX }}
          PFX_PASS: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $enabled = -not [string]::IsNullOrWhiteSpace($env:PFX_B64) -and -not [string]::IsNullOrWhiteSpace($env:PFX_PASS)
          "enabled=$enabled" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($enabled) {
            Write-Host "Code signing is enabled for this release."
          } else {
            Write-Host "::notice::Code signing secrets are missing; this release will be unsigned."
          }

      - name: Restore all projects
        run: |
          dotnet restore src/StorageMaster.Core/StorageMaster.Core.csproj
          dotnet restore src/StorageMaster.Storage/StorageMaster.Storage.csproj
          dotnet restore src/StorageMaster.Platform.Windows/StorageMaster.Platform.Windows.csproj
          dotnet restore tests/StorageMaster.Tests/StorageMaster.Tests.csproj
          dotnet restore src/StorageMaster.UI/StorageMaster.UI.csproj

      - name: Run tests
        run: dotnet test tests/StorageMaster.Tests/StorageMaster.Tests.csproj -c Release --verbosity normal --no-restore -p:Platform=x64

      - name: Publish win-x64
        run: |
          dotnet publish src/StorageMaster.UI/StorageMaster.UI.csproj `
            /p:PublishProfile=win-x64 -c Release --no-restore `
            /p:UseXamlCompilerExecutable=true

      - name: Stage WinAppSDK 1.6 runtime MSIX prereq
        shell: pwsh
        run: |
          $package = "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk\1.6.250205002\tools\MSIX\win10-x64\Microsoft.WindowsAppRuntime.1.6.msix"
          $script = "installer\Install-WindowsAppRuntime.ps1"
          if (-not (Test-Path $package)) {
            throw "Windows App SDK runtime package was not found: $package"
          }
          if (-not (Test-Path $script)) {
            throw "Windows App SDK runtime installer script was not found: $script"
          }

          $target = "artifacts\publish\win-x64\prereqs"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item $package (Join-Path $target "Microsoft.WindowsAppRuntime.1.6.msix") -Force
          Copy-Item $script (Join-Path $target "Install-WindowsAppRuntime.ps1") -Force

      - name: Copy Turbo Scanner to publish output
        run: |
          Copy-Item `
            turbo-scanner\target\x86_64-pc-windows-msvc\release\turbo-scanner.exe `
            artifacts\publish\win-x64\turbo-scanner.exe

      - name: Copy optional FFmpeg bundle
        shell: pwsh
        run: |
          $source = "installer\ffmpeg"
          if (-not (Test-Path $source)) {
            Write-Host "No bundled FFmpeg directory found."
            exit 0
          }

          if (-not (Test-Path (Join-Path $source "ffmpeg.exe")) -or -not (Test-Path (Join-Path $source "ffprobe.exe"))) {
            throw "installer\\ffmpeg must contain both ffmpeg.exe and ffprobe.exe."
          }

          $target = "artifacts\publish\win-x64\tools\ffmpeg"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item (Join-Path $source "*") $target -Recurse -Force

      # ── Code signing (optional) ────────────────────────────────────────────
      # Set CODE_SIGNING_PFX (base-64-encoded .pfx) and CODE_SIGNING_PFX_PASSWORD
      # in repo Settings → Secrets to enable Authenticode signing.
      - name: Sign binaries (optional)
        if: steps.signing.outputs.enabled == 'True'
        env:
          PFX_B64:  ${{ secrets.CODE_SIGNING_PFX }}
          PFX_PASS: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $pfxPath = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))

          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
                         -Recurse -Filter signtool.exe |
                       Sort-Object FullName -Descending |
                       Select-Object -First 1).FullName

          Get-ChildItem artifacts\publish\win-x64 -Recurse -Include *.exe,*.dll |
            ForEach-Object {
              & $signtool sign /fd SHA256 /td SHA256 `
                /tr http://timestamp.digicert.com `
                /f $pfxPath /p $env:PFX_PASS $_.FullName
            }

          Remove-Item $pfxPath -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          iscc installer\StorageMaster.iss /DAppVersion=$version

      - name: Inspect release artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $installer = "artifacts\installer\StorageMaster-$version-win-x64-Setup.exe"
          if (-not (Test-Path $installer)) {
            throw "Expected installer was not produced: $installer"
          }
          if (-not (Test-Path "artifacts\publish\win-x64\prereqs\Microsoft.WindowsAppRuntime.1.6.msix")) {
            throw "Windows App Runtime 1.6 MSIX prereq is missing from publish output."
          }
          if (-not (Test-Path "artifacts\publish\win-x64\prereqs\Install-WindowsAppRuntime.ps1")) {
            throw "Windows App Runtime prereq installer script is missing from publish output."
          }
          $sizeMb = (Get-Item $installer).Length / 1MB
          if ($sizeMb -gt 80) {
            throw "Installer is unexpectedly large: $([Math]::Round($sizeMb, 2)) MB"
          }
          Write-Host "Installer verified: $installer ($([Math]::Round($sizeMb, 2)) MB)"

      - name: Sign installer (optional)
        if: steps.signing.outputs.enabled == 'True'
        env:
          PFX_B64:  ${{ secrets.CODE_SIGNING_PFX }}
          PFX_PASS: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $pfxPath = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))

          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
                         -Recurse -Filter signtool.exe |
                       Sort-Object FullName -Descending |
                       Select-Object -First 1).FullName

          Get-ChildItem artifacts\installer -Filter *.exe |
            ForEach-Object {
              & $signtool sign /fd SHA256 /td SHA256 `
                /tr http://timestamp.digicert.com `
                /f $pfxPath /p $env:PFX_PASS $_.FullName
            }

          Remove-Item $pfxPath -Force

      - name: Verify Authenticode signatures
        if: steps.signing.outputs.enabled == 'True'
        shell: pwsh
        run: |
          $targets = @()
          $targets += Get-ChildItem artifacts\publish\win-x64 -Recurse -Include *.exe,*.dll
          $targets += Get-ChildItem artifacts\installer -Filter *.exe

          if ($targets.Count -eq 0) {
            throw "No binaries found to verify."
          }

          foreach ($file in $targets) {
            $sig = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($sig.Status -ne 'Valid') {
              throw "Invalid signature for $($file.FullName): $($sig.Status)"
            }
            if ($null -eq $sig.TimeStamperCertificate) {
              throw "Missing trusted timestamp for $($file.FullName)."
            }
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $checksumPath = "artifacts\installer\checksums.txt"
          $assets = Get-ChildItem artifacts\installer\StorageMaster-*-win-x64-Setup.exe
          if ($assets.Count -eq 0) {
            throw "Installer asset not found."
          }
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Path $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $lines | Set-Content -Path $checksumPath -Encoding ascii

      - name: Generate release notes
        shell: pwsh
        env:
          SIGNED_RELEASE: ${{ steps.signing.outputs.enabled }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $isSigned = [System.String]::Equals($env:SIGNED_RELEASE, 'True', [System.StringComparison]::OrdinalIgnoreCase)
          $trustLine = if ($isSigned) {
            "Signed release: all binaries and installer are Authenticode-signed."
          } else {
            "Unsigned release: signing secrets were not configured for this run."
          }

          $previousTag = git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1
          $changes = if ($previousTag) {
            git log "$previousTag..$tag" --pretty='- %s (%h)'
          } else {
            git log -n 50 --pretty='- %s (%h)'
          }
          if (-not $changes) {
            $changes = @("- Internal maintenance updates.")
          }

          $notes = @(
            "# StorageMaster $version"
            ""
            $trustLine
            ""
            "## Changelog"
          ) + $changes + @(
            ""
            "## Assets"
            "- StorageMaster-$version-win-x64-Setup.exe"
            "- checksums.txt"
          )

          $notes | Set-Content -Path artifacts\installer\release-notes.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/installer/StorageMaster-*-win-x64-Setup.exe
            artifacts/installer/checksums.txt
          body_path: artifacts/installer/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
